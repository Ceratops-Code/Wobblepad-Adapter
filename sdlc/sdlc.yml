version: 4
kind: ceratops-sdlc
repository:
  capabilities:
    uv:
      executable: uv
    java:
      executable: java
      version: "17"
    jdk:
      executable: java
      version: "17"
    android-sdk:
      executable: sdkmanager
    node:
      executable: node
      version: "24"
    npm:
      executable: npm
    adb:
      executable: adb
  actions:
    validate:
      requires:
        capabilities:
          - uv
          - java
          - jdk
          - android-sdk
          - node
          - npm
      result-schema: ceratops-repository-stage-result.v1
      steps:
        - run:
            - uv
            - run
            - --project
            - scripts
            - --locked
            - python
            - -c
            - import shutil, subprocess; subprocess.run([shutil.which('npm'), '--prefix',
              'scripts', 'ci'], check=True)
        - run:
            - uv
            - run
            - --project
            - scripts
            - --locked
            - python
            - scripts/validate-repository.py
    test:
      requires:
        capabilities:
          - uv
          - java
      result-schema: ceratops-repository-stage-result.v1
      steps:
        - run:
            - uv
            - run
            - --project
            - scripts
            - --locked
            - python
            - scripts/run-tests.py
deliverables:
  packages:
    wobblepad-apk:
      source: app
      prerequisites: []
      artifact:
        type: android-apk
        output-directory: app/build/outputs/apk/debug
        filename-pattern: app-debug.apk
      actions:
        build:
          requires:
            capabilities:
              - uv
              - java
          result-schema: ceratops-build-result.v1
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - python
                - scripts/build-android.py
    wobblepad-windows-bundle:
      source: windows-app
      prerequisites: []
      artifact:
        type: windows-app-zip
        output-directory: .build/windows
        filename-pattern: WobblePad-Windows.zip
      actions:
        build:
          requires:
            capabilities:
              - uv
          result-schema: ceratops-build-result.v1
          steps:
            - run:
                - uv
                - run
                - --project
                - windows-app
                - --locked
                - python
                - scripts/build-windows.py
  apps:
    wobblepad-android:
      source: app
      manifest: app/src/main/AndroidManifest.xml
      prerequisites:
        - wobblepad-apk
      actions:
        validate:
          requires:
            capabilities:
              - uv
              - jdk
              - android-sdk
          validation-capabilities:
            - android-build
            - android-lint
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - python
                - scripts/validate-repository.py
        install:
          requires:
            capabilities:
              - uv
              - adb
          parameters:
            - serial
          result-schema: ceratops-deployment-result.v1
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - python
                - scripts/deploy-android.py
                - --serial
                - "{serial}"
    wobblepad-windows:
      source: windows-app
      manifest: windows-app/pyproject.toml
      prerequisites:
        - wobblepad-windows-bundle
      actions:
        validate:
          requires:
            capabilities: []
          no-op: Repository validation and tests cover the Windows app source.
        install:
          requires:
            capabilities:
              - uv
          result-schema: ceratops-deployment-result.v1
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - python
                - scripts/deploy-windows.py
