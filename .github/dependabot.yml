version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      codeql-action:
        patterns:
          - github/codeql-action/*
  - package-ecosystem: uv
    directory: /scripts
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /windows-app
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
